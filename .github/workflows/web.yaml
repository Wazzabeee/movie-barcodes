name: Web app

# Tests the in-browser app (web/) and deploys it to GitHub Pages from main.
# One-time setup: repository Settings > Pages > Build and deployment > Source: "GitHub Actions".

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/web.yaml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    name: Do the web app tests pass?
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Run the color math tests
      working-directory: web
      run: node --test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4
    - name: Keep only the files the app serves
      run: |
        mkdir _site
        cp web/index.html web/style.css _site/
        cp -r web/src _site/src
    - uses: actions/configure-pages@v6
    - uses: actions/upload-pages-artifact@v3
      with:
        path: _site
    - id: deployment
      uses: actions/deploy-pages@v4
